services:
  - type: web
    name: tj-barbershop-api
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: booking-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/bookings
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: APP_ORIGIN
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
